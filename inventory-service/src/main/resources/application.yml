spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:h2:mem:stockflow;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # Escenario objetivo: carga media, un unico servicio con trafico de dashboard + registro de
      # movimientos (no picos masivos concurrentes). Valores dimensionados para ese perfil, no defaults.
      # 10 conexiones cubren con margen los hilos del connector (Tomcat default: 200 threads, pero en
      # carga media real solo una fraccion pequena hace uso concurrente de la BD al mismo tiempo).
      maximum-pool-size: 10
      # Mantener la mitad del pool "caliente" evita el costo de abrir conexiones nuevas en cada rafaga
      # de trafico sin sobre-reservar recursos cuando el sistema esta en reposo.
      minimum-idle: 5
      # Tiempo maximo de espera por una conexion libre antes de fallar rapido (fail-fast) en vez de
      # colgar la peticion HTTP indefinidamente cuando el pool esta saturado.
      connection-timeout: 20000
      # Conexiones ociosas por mas de 5 minutos se liberan; suficiente margen para no descartar
      # conexiones en cada pausa corta entre peticiones, pero sin retener recursos innecesarios.
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

resilience4j:
  circuitbreaker:
    instances:
      alertsService:
        # Ventana de las ultimas 10 llamadas para decidir si el circuito abre.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Si el 50% o mas de esas llamadas fallan, se abre el circuito para dejar de golpear la BD.
        failure-rate-threshold: 50
        # Tiempo que el circuito permanece abierto antes de probar de nuevo en estado half-open.
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

  retry:
    instances:
      movementRegistration:
        # Maximo 3 intentos (1 original + 2 reintentos) segun lo pedido en la prueba.
        max-attempts: 3
        # Espera exponencial: 500ms, 1000ms, entre reintentos para no saturar la BD ante fallos transitorios.
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  ratelimiter:
    instances:
      movementHistory:
        # Maximo 10 peticiones por segundo al historial para proteger la base de datos de sobrecarga.
        limit-for-period: 10
        limit-refresh-period: 1s
        # No hacer esperar al cliente: si se supera el limite, falla inmediato con 429.
        timeout-duration: 0s

management:
  health:
    circuitbreakers:
      enabled: true
