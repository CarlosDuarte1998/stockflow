<div class="p-8 flex flex-col gap-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
    @for (kpi of kpis(); track kpi.label) {
      <div class="bg-surface-0 rounded-xl border border-surface-200 shadow-sm p-5 flex items-start justify-between hover:shadow-md transition-shadow">
        <div class="flex flex-col gap-1">
          <span class="text-sm text-surface-500 font-medium">{{ kpi.label }}</span>
          <span class="text-3xl font-bold text-surface-900">{{ kpi.value }}</span>
          @if (kpi.hint) {
            <span class="text-xs" [style.color]="kpi.color">{{ kpi.hint }}</span>
          }
        </div>
        <span
          class="w-11 h-11 rounded-full flex items-center justify-center shrink-0"
          [style.background]="kpi.color + '1a'"
        >
          <i class="pi {{ kpi.icon }} text-lg" [style.color]="kpi.color"></i>
        </span>
      </div>
    }
  </div>

  @if (store.error()) {
    <div class="rounded-lg border border-red-200 bg-red-50 text-red-700 px-4 py-3 text-sm flex items-center gap-2">
      <i class="pi pi-exclamation-triangle"></i>
      {{ store.error() }}
    </div>
  }

  <div class="bg-surface-0 rounded-xl border border-surface-200 shadow-sm p-6 min-h-[12rem]">
    @defer (on viewport) {
      <app-advanced-stats />
    } @placeholder {
      <div class="flex flex-col gap-3">
        <p-skeleton height="1.5rem" width="14rem" />
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <p-skeleton height="7rem" borderRadius="0.75rem" />
          <p-skeleton height="7rem" borderRadius="0.75rem" />
          <p-skeleton height="7rem" borderRadius="0.75rem" />
        </div>
      </div>
    } @loading (minimum 300ms) {
      <div class="flex justify-center py-10">
        <p-progressSpinner styleClass="w-10 h-10" strokeWidth="4" />
      </div>
    } @error {
      <p class="text-red-600 text-sm">No se pudieron cargar las estadisticas avanzadas.</p>
    }
  </div>
</div>
