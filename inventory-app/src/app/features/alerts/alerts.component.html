<div class="p-8 flex flex-col gap-5">
  @if (store.alerts().length === 0) {
    <div class="bg-surface-0 rounded-xl border border-surface-200 shadow-sm p-10 flex flex-col items-center gap-3 text-center">
      <span class="w-14 h-14 rounded-full bg-green-100 flex items-center justify-center">
        <i class="pi pi-check text-2xl text-green-600"></i>
      </span>
      <p class="text-surface-600 font-medium">No hay alertas activas</p>
      <p class="text-surface-400 text-sm">Todo el inventario esta por encima del stock minimo.</p>
    </div>
  } @else {
    <div class="flex flex-col gap-3">
      @for (alert of store.alerts(); track alert.productId) {
        <div
          class="bg-surface-0 rounded-xl border shadow-sm p-4 flex items-center gap-4"
          [class.border-red-200]="alert.severity === 'CRITICAL'"
          [class.border-amber-200]="alert.severity === 'LOW'"
        >
          <span
            class="w-11 h-11 rounded-full flex items-center justify-center shrink-0"
            [class.bg-red-100]="alert.severity === 'CRITICAL'"
            [class.bg-amber-100]="alert.severity === 'LOW'"
          >
            <i
              class="pi text-lg"
              [class.pi-times-circle]="alert.severity === 'CRITICAL'"
              [class.text-red-600]="alert.severity === 'CRITICAL'"
              [class.pi-exclamation-circle]="alert.severity === 'LOW'"
              [class.text-amber-600]="alert.severity === 'LOW'"
            ></i>
          </span>

          <div class="flex-1 flex flex-col">
            <span class="font-semibold text-surface-900">{{ alert.productName }}</span>
            <span class="text-sm text-surface-500">
              Stock actual: <span class="font-medium text-surface-700">{{ alert.currentStock }}</span>
              / minimo: <span class="font-medium text-surface-700">{{ alert.minStock }}</span>
            </span>
          </div>

          <p-tag
            [severity]="alert.severity === 'CRITICAL' ? 'danger' : 'warn'"
            [value]="alert.severity === 'CRITICAL' ? 'CRITICO' : 'BAJO'"
          />
        </div>
      }
    </div>
  }
</div>
