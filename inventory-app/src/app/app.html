<p-toast />

<div class="min-h-screen flex bg-surface-50">
  <aside class="w-64 shrink-0 bg-surface-900 text-surface-0 flex flex-col">
    <div class="flex items-center gap-2 px-6 py-5 border-b border-surface-700">
      <span class="w-9 h-9 rounded-lg bg-primary-500 flex items-center justify-center">
        <i class="pi pi-box text-lg text-white"></i>
      </span>
      <div class="flex flex-col leading-tight">
        <span class="font-bold text-base">StockFlow</span>
        <span class="text-xs text-surface-400">Inventory Monitor</span>
      </div>
    </div>

    <nav class="flex-1 px-3 py-4 flex flex-col gap-1">
      @for (item of itemsNavegacion; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-primary-500/15 text-primary-300"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-surface-300 hover:bg-surface-800 hover:text-surface-0 transition-colors"
        >
          <i class="pi {{ item.icono }} text-base"></i>
          <span>{{ item.etiqueta }}</span>
        </a>
      }
    </nav>

    <div class="px-6 py-4 border-t border-surface-700 text-xs text-surface-500">
      StockFlow Inc. &copy; 2026
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-surface-0 border-b border-surface-200 px-8 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-semibold text-surface-900">{{ tituloPagina() }}</h1>
        <p class="text-sm text-surface-500">{{ subtituloPagina() }}</p>
      </div>
      <div class="flex items-center gap-2 text-sm text-surface-500">
        <i class="pi pi-clock"></i>
        <span>{{ hoy }}</span>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
